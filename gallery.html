<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery | Team Portfolio</title>
    <style>
        @import url("/css/common.css");
        @import url("/css/gallery.css");
    </style>
</head>

<body>

    <div class="gallery-container">
        <!-- 페이지 제목 -->
        <header class="gallery-header">
            <div class="category">OUR PROJECTS</div>
            <h1>갤러리</h1>
            <p>
                저희의 프로젝트를 소개합니다.<br>
                각 작품을 클릭하면 자세한 내용을 확인할 수 있습니다.
            </p>

            <section class="gallery-search" aria-label="작품 검색">
                <form class="search-bar" id="searchForm" role="search">
                    <div class="search-input-wrap">
                        <input
                            type="search"
                            id="searchInput"
                            class="search-input"
                            placeholder="검색어를 입력하세요 (예: 토스트, 도서관, Unity, 양한세...)"
                            autocomplete="off"
                            aria-label="작품 검색어 입력"
                        >
                        <button type="button" class="search-clear-btn" id="clearBtn" aria-label="검색어 지우기">✕</button>
                    </div>
                    <button type="submit" class="search-submit-btn">검색</button>
                </form>

                <div class="tech-filter-bar" id="techFilterBar" aria-label="기술 스택 카테고리"></div>
                <div class="search-meta">
                    <span id="resultCount">전체 작품: 6건</span>
                </div>
            </section>
        </header>

        <!-- 작품 목록 -->
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="search-empty" id="searchEmpty" hidden>
            일치하는 작품이 없습니다. 다른 키워드나 기술 스택으로 검색해 보세요.
        </div>
    </div>

    <!-- Footer 영역 -->
    <footer class="site-footer">
        © 2026 OSS G Team. All rights reserved.
    </footer>

    <!-- 작품 상세 모달 -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>

            <img src="" alt="작품 상세 이미지" class="modal-image" id="modalImage">

            <div class="modal-info">
                <div class="modal-number" id="modalNumber"></div>
                <h2 id="modalTitle"></h2>
                <p class="modal-description" id="modalDescription"></p>

                <div class="detail-section">
                    <h3>PROJECT INTRODUCTION</h3>
                    <p id="modalIntro"></p>
                </div>

                <div class="detail-section">
                    <h3>KEY FEATURES</h3>
                    <p id="modalFeatures"></p>
                </div>

                <div class="detail-section">
                    <h3>TECH STACK</h3>
                    <div class="tech-list" id="modalTech"></div>
                </div>

                <a id="modalLink" class="visit-btn" href="#" target="_blank" rel="noopener noreferrer">
                    사이트 방문 →
                </a>
            </div>
        </div>
    </div>

    <nav class="navigation"></nav>
    <script src="js/nav.js"></script>
    <script src="js/common.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
