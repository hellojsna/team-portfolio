<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Portfolio</title>
    <style>
        @import url("/css/common.css");
        @import url("/css/index.css");
    </style>
</head>

<body>

    <main class="hero">
        <h1>
            서로 다른 생각이 모여<br>
            하나의
            <span class="changing-word">
                <span class="active">새로운</span>
                <span>무한한</span>
                <span>특별한</span>
                <span>더 큰</span>
            </span>
            가능성으로
        </h1>
    </main>

    <div class="ctrl">
        <h1>
            <span class="key"><span class="face"><img src="images/Keyboard-control.png" alt="Ctrl"></span></span>
            <span class="key"><span class="face"><img src="images/Keyboard-S.png" alt="S"></span></span>
        </h1>
        <p class="reveal">
            저장하는 순간, 작업은 기록이 됩니다.
        </p>
    </div>

    <div class="paint">
        <div class="paint-stage">
            <p class="paint-word" role="img" aria-label="COLOR">
                <span data-color="0">C</span>
                <span data-color="1">O</span>
                <span data-color="2">L</span>
                <span data-color="3">O</span>
                <span data-color="4">R</span>
                <span class="paint-bar"></span>
            </p>
            <p class="paint-text">
                다섯 가지 색이 모였지만, 이곳은 조용합니다.<br>
                색이 있지만, 색이 없는 것처럼.
            </p>
        </div>
    </div>

    <div class="pages">
        <ul>
            <li class="reveal">
                <a href="index.html">
                    <span class="name">메인</span>
                    <span class="desc">팀과 사이트의 컨셉을 소개합니다.</span>
                </a>
            </li>
            <li class="reveal">
                <a href="about.html">
                    <span class="name">팀 소개</span>
                    <span class="desc">팀의 목표와 소개를 담았습니다.</span>
                </a>
            </li>
            <li class="reveal">
                <a href="profile.html">
                    <span class="name">프로필</span>
                    <span class="desc">팀원 한 사람 한 사람을 소개합니다.</span>
                </a>
            </li>
            <li class="reveal">
                <a href="gallery.html">
                    <span class="name">갤러리</span>
                    <span class="desc">함께 만든 결과물을 모았습니다.</span>
                </a>
            </li>
            <li class="reveal">
                <a href="activity.html">
                    <span class="name">활동</span>
                    <span class="desc">프로젝트를 진행하며 남긴 기록입니다.</span>
                </a>
            </li>
        </ul>
    </div>

    <nav class="navigation"></nav>
    <script src="js/nav.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
